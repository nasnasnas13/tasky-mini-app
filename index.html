<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f2">
  <title>Tasky — твой день, твой ритм</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --surface-2: #f0edf2;
      --ink: #39353d;
      --muted: #938b95;
      --line: #ece8e5;
      --accent: #8c78a1;
      --accent-soft: #e9e2ef;
      --green: #789582;
      --danger: #bd7d83;
      --shadow: 0 10px 28px rgba(61, 49, 68, .06);
      --radius: 20px;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { padding: 0 0 calc(88px + env(safe-area-inset-bottom)); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100%, 560px); margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px 24px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin: 4px 2px 26px; }
    .brand { font-size: 30px; font-weight: 800; letter-spacing: -1.6px; line-height:1; color:#6d5c7d; }
    .tagline { color:var(--muted); font-size:10px; letter-spacing:1.45px; margin-top:6px; }
    .avatar { width:42px; height:42px; border-radius:50%; background:#e9e2ef; color:#766486; display:grid; place-items:center; border:0; font-size:18px; }
    .eyebrow { font-size:11px; color:var(--muted); letter-spacing:1.1px; text-transform:uppercase; font-weight:700; }
    h1 { font-size:29px; letter-spacing:-.8px; margin:5px 0 4px; font-weight:750; }
    h2 { font-size:17px; letter-spacing:-.25px; margin:0; font-weight:750; }
    p { margin:0; }
    .subtle { color:var(--muted); font-size:13px; line-height:1.5; }
    .heading-row { display:flex; align-items:end; justify-content:space-between; gap:12px; margin: 8px 0 18px; }
    .week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:7px; margin:18px 0 20px; }
    .day-chip { border:0; background:var(--surface); border-radius:15px; padding:10px 2px 9px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 2px 9px rgba(44,38,48,.025); }
    .day-chip .day-name { font-size:10px; font-weight:700; }
    .day-chip .day-num { font-size:15px; font-weight:700; color:var(--ink); }
    .day-chip.selected { background:var(--accent-soft); color:#756386; }
    .day-chip.selected .day-num { color:#665375; }
    .day-chip.today:not(.selected) { outline:1px solid #d5c9df; }
    .day-dot { width:4px; height:4px; border-radius:50%; background:transparent; }
    .day-chip.has-items .day-dot { background:#9a87ac; }
    .progress-card { border-radius:var(--radius); background:#e9e2ef; padding:17px 18px; margin-bottom:22px; }
    .progress-top { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:#5e506d; margin-bottom:12px; }
    .progress-count { font-size:22px; letter-spacing:-.7px; }
    .progress-track { height:8px; border-radius:20px; background:rgba(255,255,255,.72); overflow:hidden; }
    .progress-fill { height:100%; border-radius:20px; background:#927da6; transition:width .2s ease; }
    .progress-note { margin-top:8px; color:#766b80; font-size:11px; }
    .section-row { display:flex; justify-content:space-between; align-items:center; margin:0 2px 11px; }
    .count-pill { color:#827a85; background:#eeebef; border-radius:99px; padding:6px 10px; font-size:11px; }
    .task-list { display:flex; flex-direction:column; gap:9px; }
    .task-card { background:var(--surface); border-radius:16px; padding:13px 12px; display:flex; align-items:center; gap:11px; box-shadow:0 3px 12px rgba(43,37,48,.025); border:1px solid rgba(230,225,229,.45); transition:opacity .15s, transform .15s; }
    .task-card.dragging { opacity:.4; transform:scale(.98); }
    .task-card.drop-target { outline:2px dashed #a18eaf; }
    .color-mark { width:10px; height:34px; border-radius:8px; flex:none; }
    .task-main { min-width:0; flex:1; }
    .task-title { font-size:14px; font-weight:650; line-height:1.35; overflow-wrap:anywhere; }
    .task-meta { display:flex; align-items:center; gap:6px; margin-top:4px; color:var(--muted); font-size:10px; }
    .type-tag { border-radius:30px; background:#f3f0f4; padding:3px 7px; }
    .task-card.done { background:#f0efee; border-color:#eeecea; box-shadow:none; }
    .task-card.done .task-title { color:#aaa5aa; text-decoration:line-through; }
    .task-card.done .color-mark { background:#d1ced0 !important; }
    .task-card.done .task-meta { color:#b0aaaf; }
    .check { appearance:none; width:23px; height:23px; border:1.6px solid #d7d0d9; border-radius:8px; margin:0; flex:none; display:grid; place-items:center; background:white; }
    .check:checked { background:#9a87aa; border-color:#9a87aa; }
    .check:checked:after { content:'✓'; color:#fff; font-size:15px; font-weight:800; }
    .task-actions { display:flex; flex-direction:column; gap:3px; }
    .tiny-btn { border:0; background:transparent; color:#a69eaa; padding:3px 5px; font-size:12px; line-height:1; }
    .add-btn { width:100%; border:1px dashed #cbbfd4; background:rgba(255,255,255,.48); color:#776487; border-radius:16px; padding:14px; margin-top:12px; font-size:13px; font-weight:700; }
    .empty { background:rgba(255,255,255,.65); border:1px dashed #ded7e1; border-radius:18px; padding:26px 18px; text-align:center; color:var(--muted); }
    .empty-icon { font-size:26px; margin-bottom:8px; }
    .empty strong { display:block; color:#63596a; margin-bottom:5px; font-size:14px; }
    .bottom-nav { position:fixed; z-index:10; bottom:0; left:0; right:0; padding:9px 12px calc(9px + env(safe-area-inset-bottom)); background:rgba(250,249,247,.94); backdrop-filter:blur(18px); border-top:1px solid rgba(225,220,222,.8); }
    .nav-inner { width:min(100%,560px); margin:auto; display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
    .nav-btn { border:0; border-radius:14px; padding:8px 3px 6px; color:#a29aa4; background:transparent; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; }
    .nav-btn .nav-icon { font-size:18px; line-height:1; }
    .nav-btn.active { background:#eee8f2; color:#746184; font-weight:750; }
    .toolbar { display:flex; align-items:center; gap:8px; }
    .soft-btn { border:0; border-radius:12px; background:#eee9f1; color:#786786; padding:9px 12px; font-size:12px; font-weight:700; }
    .week-grid-wrap { background:white; border-radius:18px; padding:13px 10px; overflow:hidden; box-shadow:var(--shadow); }
    .habit-grid { width:100%; border-collapse:separate; border-spacing:3px 7px; table-layout:fixed; }
    .habit-grid th { font-size:10px; color:#9c949d; font-weight:650; padding:4px 0; }
    .habit-grid th:first-child { width:37%; text-align:left; padding-left:5px; }
    .habit-grid td:first-child { font-size:11px; font-weight:650; line-height:1.25; overflow-wrap:anywhere; padding:6px 3px 6px 5px; }
    .habit-cell { width:100%; aspect-ratio:1; max-width:31px; border:0; border-radius:9px; background:#f2f0f1; color:#b7b0b8; font-size:12px; font-weight:800; }
    .habit-cell.scheduled { background:var(--habit-color); color:#5e5762; }
    .habit-cell.completed { background:#d5d3d4; color:white; }
    .legend { display:flex; gap:13px; align-items:center; color:var(--muted); font-size:10px; margin:13px 3px 0; }
    .legend span { display:flex; align-items:center; gap:5px; }
    .legend i { display:inline-block; width:9px; height:9px; border-radius:3px; background:#d5d3d4; }
    .habit-card { background:white; border-radius:17px; padding:14px; display:flex; align-items:center; gap:11px; box-shadow:0 3px 12px rgba(43,37,48,.025); }
    .habit-info { flex:1; min-width:0; }
    .habit-name { font-size:14px; font-weight:700; }
    .habit-days { color:var(--muted); font-size:11px; margin-top:4px; }
    .streak { color:#8d789e; font-size:10px; font-weight:700; white-space:nowrap; }
    .icon-btn { border:0; background:#f4f1f5; color:#83768e; border-radius:10px; width:32px; height:32px; }
    .history-summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:17px 0; }
    .stat-card { background:white; border-radius:17px; padding:15px; box-shadow:var(--shadow); }
    .stat-value { color:#756184; font-size:27px; font-weight:800; letter-spacing:-1px; margin:6px 0 2px; }
    .stat-label { color:var(--muted); font-size:11px; }
    .history-day { background:white; border-radius:15px; padding:13px; margin-bottom:8px; }
    .history-day-head { display:flex; justify-content:space-between; font-size:12px; font-weight:750; margin-bottom:8px; }
    .history-item { display:flex; align-items:center; gap:8px; font-size:12px; color:#8f8991; padding:4px 0; }
    .history-item .mini-dot { width:8px; height:8px; border-radius:50%; background:#d4d0d5; }
    .history-item.completed { color:#a9a4aa; text-decoration:line-through; }
    .history-item.completed .mini-dot { background:#d0ced1; }
    .form-overlay { position:fixed; inset:0; z-index:30; background:rgba(46,39,49,.32); display:none; align-items:flex-end; justify-content:center; padding:12px; }
    .form-overlay.open { display:flex; }
    .form-sheet { width:min(100%,540px); max-height:90dvh; overflow:auto; background:#fbfaf9; border-radius:24px; padding:20px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 20px 70px rgba(35,27,40,.2); }
    .sheet-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .close-btn { border:0; width:32px; height:32px; border-radius:50%; background:#efebf0; color:#82778b; font-size:18px; }
    .field { margin:14px 0; }
    .field label { display:block; color:#756c79; font-size:12px; font-weight:700; margin-bottom:8px; }
    .text-input, .date-input { width:100%; border:1px solid #e7e1e7; background:#fff; border-radius:13px; padding:13px 14px; outline:none; color:var(--ink); font-size:14px; }
    .text-input:focus, .date-input:focus { border-color:#b7a6c3; box-shadow:0 0 0 3px rgba(183,166,195,.16); }
    .type-switch { display:grid; grid-template-columns:1fr 1fr; background:#eeeaf0; border-radius:13px; padding:4px; gap:4px; }
    .type-switch button { border:0; background:transparent; border-radius:10px; padding:10px; color:#827a86; font-size:12px; font-weight:700; }
    .type-switch button.active { background:white; color:#715f81; box-shadow:0 2px 7px rgba(48,37,52,.06); }
    .swatches { display:flex; gap:10px; flex-wrap:wrap; }
    .swatch { width:31px; height:31px; border:2px solid white; border-radius:50%; box-shadow:0 0 0 1px #ddd6dd; }
    .swatch.selected { box-shadow:0 0 0 2px #89759b; }
    .weekday-picker { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
    .weekday { border:0; border-radius:10px; background:#f0edf0; color:#89818b; padding:10px 0; font-size:11px; font-weight:750; }
    .weekday.selected { color:#665375; background:#e8dfef; }
    .primary-btn { width:100%; border:0; border-radius:14px; background:#89759b; color:white; padding:14px; font-size:14px; font-weight:750; margin-top:10px; }
    .secondary-btn { border:0; background:transparent; color:#a46e76; padding:12px; width:100%; font-size:12px; font-weight:700; }
    .notice { color:#98909a; font-size:10px; line-height:1.45; margin-top:10px; }
    .toast { position:fixed; z-index:50; bottom:calc(85px + env(safe-area-inset-bottom)); left:50%; transform:translate(-50%,15px); opacity:0; pointer-events:none; background:#4d4453; color:white; padding:10px 15px; border-radius:99px; font-size:12px; transition:.2s; white-space:nowrap; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .hide { display:none !important; }
    @media (min-width:600px) { .app { padding-top:28px; } .form-overlay { align-items:center; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><div class="brand">tasky.</div><div class="tagline">ТВОЙ ДЕНЬ. ТВОЙ РИТМ.</div></div>
      <button class="avatar" id="profileBtn" aria-label="Профиль">✿</button>
    </header>
    <section id="screen"></section>
  </main>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <div class="nav-inner">
      <button class="nav-btn active" data-tab="today"><span class="nav-icon">☼</span><span>Сегодня</span></button>
      <button class="nav-btn" data-tab="week"><span class="nav-icon">▦</span><span>Неделя</span></button>
      <button class="nav-btn" data-tab="habits"><span class="nav-icon">↻</span><span>Привычки</span></button>
      <button class="nav-btn" data-tab="history"><span class="nav-icon">▤</span><span>История</span></button>
    </div>
  </nav>
  <div class="form-overlay" id="formOverlay" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="form-sheet">
      <div class="sheet-top"><h2 id="formTitle">Новая задача</h2><button class="close-btn" id="closeForm" aria-label="Закрыть">×</button></div>
      <form id="itemForm">
        <div class="type-switch" id="typeSwitch">
          <button type="button" class="active" data-kind="task">Задача</button>
          <button type="button" data-kind="habit">Привычка</button>
        </div>
        <div class="field"><label for="itemTitle">Название</label><input class="text-input" id="itemTitle" maxlength="80" placeholder="Например, почитать книгу" required></div>
        <div class="field"><label>Цвет</label><div class="swatches" id="swatches"></div></div>
        <div class="field" id="dateField"><label for="itemDate">Дата</label><input class="date-input" id="itemDate" type="date" required></div>
        <div class="field hide" id="daysField"><label>Повторять по дням</label><div class="weekday-picker" id="weekdayPicker"></div></div>
        <div class="field hide" id="startField"><label for="startDate">Начать с</label><input class="date-input" id="startDate" type="date"></div>
        <button class="primary-btn" type="submit" id="saveItem">Добавить задачу</button>
        <button class="secondary-btn hide" type="button" id="deleteItem">Удалить</button>
        <p class="notice">Задачи и привычки пока сохраняются на этом устройстве. Облачная синхронизация будет добавлена отдельно.</p>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'tasky_mini_app_v1';
  const COLORS = ['#D5C6E3','#C7DCCF','#EBCDBD','#C5DCEB','#F0DFAF','#EBCBD8'];
  const COLOR_NAMES = ['Лавандовый','Шалфейный','Персиковый','Голубой','Ванильный','Розовый'];
  const DAY_NAMES = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const DAY_FULL = ['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];
  const $ = (s, root=document) => root.querySelector(s);
  const $$ = (s, root=document) => [...root.querySelectorAll(s)];
  const todayISO = () => toISO(new Date());
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
  const shiftDate = (iso,n) => { const d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); };
  const id = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(16).slice(2)}`;
  const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = iso => fromISO(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const fmtLong = iso => fromISO(iso).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const defaultState = () => ({tasks:[],habits:[],occurrences:[],dayOrder:{},createdAt:new Date().toISOString()});
  let state = loadState();
  let activeTab = 'today';
  let selectedDate = todayISO();
  let formKind = 'task';
  let editing = null;
  let selectedColor = COLORS[0];
  let selectedDays = [1,2,3,4,5,6,0];
  let dragId = null;

  function loadState(){
    try { const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return defaultState(); const parsed=JSON.parse(raw); return {...defaultState(),...parsed}; }
    catch(e){ console.warn('Tasky storage read failed',e); return defaultState(); }
  }
  function saveState(){ try { localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); } catch(e){ toast('Не удалось сохранить данные на устройстве'); } }
  function toast(message){ const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),2300); }
  function ensureOccurrences(from=todayISO(), days=120){
    const end=shiftDate(from,days);
    const existing=new Set(state.occurrences.map(o=>`${o.habitId}|${o.date}`));
    state.habits.filter(h=>h.active).forEach(h=>{
      const start=h.startDate>from?h.startDate:from;
      for(let date=start;date<=end;date=shiftDate(date,1)){
        if(h.weekdays.includes(fromISO(date).getDay()) && !existing.has(`${h.id}|${date}`)){
          state.occurrences.push({id:id(),habitId:h.id,title:h.title,color:h.color,date,done:false,completedAt:null,createdAt:new Date().toISOString()});
        }
      }
    });
    saveState();
  }
  function getDayItems(date){
    const items=[
      ...state.tasks.filter(t=>t.date===date).map(t=>({...t,kind:'task'})),
      ...state.occurrences.filter(o=>o.date===date).map(o=>({...o,kind:'habit',sourceHabitId:o.habitId}))
    ];
    const order=state.dayOrder[date]||[];
    return items.sort((a,b)=>{
      const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
      if(ai!==-1||bi!==-1) return (ai===-1?9999:ai)-(bi===-1?9999:bi);
      return (a.createdAt||'').localeCompare(b.createdAt||'');
    });
  }
  function persistOrder(date, ids){ state.dayOrder[date]=ids; saveState(); }
  function setDone(itemId,kind,done){
    if(kind==='task'){
      const t=state.tasks.find(x=>x.id===itemId); if(t) t.done=done;
    } else {
      const o=state.occurrences.find(x=>x.id===itemId); if(o){o.done=done;o.completedAt=done?new Date().toISOString():null;}
    }
    saveState(); render();
  }
  function weekStart(iso){ const d=fromISO(iso); const offset=(d.getDay()+6)%7; d.setDate(d.getDate()-offset); return toISO(d); }
  function getWeekDates(iso){ const start=weekStart(iso); return Array.from({length:7},(_,i)=>shiftDate(start,i)); }
  function isScheduled(h,date){ return date>=h.startDate && h.weekdays.includes(fromISO(date).getDay()); }
  function findOccurrence(habitId,date){ return state.occurrences.find(o=>o.habitId===habitId&&o.date===date); }
  function streakFor(h){
    let count=0; let cursor=todayISO();
    if(isScheduled(h,cursor)){
      const todayOcc=findOccurrence(h.id,cursor);
      if(!todayOcc || !todayOcc.done) cursor=shiftDate(cursor,-1);
    }
    for(let guard=0;guard<370 && cursor>=h.startDate;guard++,cursor=shiftDate(cursor,-1)){
      if(!isScheduled(h,cursor)) continue;
      const occ=findOccurrence(h.id,cursor);
      if(occ && occ.done) count++; else break;
    }
    return count;
  }
  function weekCompletion(h){
    const dates=getWeekDates(selectedDate).filter(d=>isScheduled(h,d) && d<=todayISO());
    if(!dates.length) return '—';
    const done=dates.filter(d=>findOccurrence(h.id,d)?.done).length;
    return `${done}/${dates.length}`;
  }
  function render(){
    ensureOccurrences(shiftDate(todayISO(),-60),180);
    $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
    if(activeTab==='today') renderToday();
    if(activeTab==='week') renderWeek();
    if(activeTab==='habits') renderHabits();
    if(activeTab==='history') renderHistory();
  }
  function renderToday(){
    const items=getDayItems(selectedDate); const done=items.filter(x=>x.done).length; const pct=items.length?Math.round(done/items.length*100):0;
    const week=getWeekDates(selectedDate);
    const dateLabel=fromISO(selectedDate).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    $('#screen').innerHTML=`
      <div class="heading-row"><div><div class="eyebrow">${escapeHTML(dateLabel)}</div><h1>${selectedDate===todayISO()?'Сегодня ♡':escapeHTML(fromISO(selectedDate).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}))}</h1><p class="subtle">Маленькие шаги — большие результаты.</p></div><div class="toolbar"><button class="soft-btn" id="backToday">Сегодня</button></div></div>
      <div class="week-strip">${week.map(d=>{const its=getDayItems(d),isToday=d===todayISO(),isSel=d===selectedDate;const date=fromISO(d);return `<button class="day-chip ${isSel?'selected':''} ${isToday?'today':''} ${its.length?'has-items':''}" data-date="${d}"><span class="day-name">${DAY_NAMES[date.getDay()]}</span><span class="day-num">${date.getDate()}</span><i class="day-dot"></i></button>`}).join('')}</div>
      <div class="progress-card"><div class="progress-top"><span>Мой прогресс</span><span class="progress-count">${done}/${items.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-note">${items.length?`${pct}% выполнено`:'Добавь первую задачу и начни свой день'}</div></div>
      <div class="section-row"><h2>Мои задачи</h2><span class="count-pill">${items.length-done} осталось</span></div>
      ${items.length?`<div class="task-list" id="taskList">${items.map((t,i)=>taskHTML(t,i,items.length)).join('')}</div>`:`<div class="empty"><div class="empty-icon">✿</div><strong>Пока здесь свободно</strong><p>Добавь задачу или создай привычку — она появится здесь автоматически.</p></div>`}
      <button class="add-btn" id="addTaskBtn">＋ Добавить задачу</button>`;
    $$('[data-date]').forEach(b=>b.addEventListener('click',()=>{selectedDate=b.dataset.date;render();}));
    $('#backToday').addEventListener('click',()=>{selectedDate=todayISO();render();});
    $('#addTaskBtn').addEventListener('click',()=>openForm('task'));
    bindTaskEvents(items);
  }
  function taskHTML(t,index,total){
    const color=t.done?'#d1ced0':t.color;
    return `<article class="task-card ${t.done?'done':''}" data-id="${t.id}" data-kind="${t.kind}" draggable="true">
      <div class="color-mark" style="background:${color}"></div>
      <div class="task-main"><div class="task-title">${escapeHTML(t.title)}</div><div class="task-meta"><span class="type-tag">${t.kind==='habit'?'Привычка':'Задача'}</span>${t.kind==='habit'?'Повторяется':''}</div></div>
      <div class="task-actions"><button class="tiny-btn edit-item" title="Редактировать">✎</button><button class="tiny-btn move-up" title="Выше" ${index===0?'disabled':''}>⌃</button><button class="tiny-btn move-down" title="Ниже" ${index===total-1?'disabled':''}>⌄</button></div>
      <input class="check" type="checkbox" aria-label="Отметить выполненным" ${t.done?'checked':''}>
    </article>`;
  }
  function bindTaskEvents(items){
    $$('.task-card').forEach(card=>{
      const item=items.find(x=>x.id===card.dataset.id);
      $('.check',card).addEventListener('change',e=>setDone(item.id,item.kind,e.target.checked));
      card.addEventListener('dblclick',()=>{if(item.kind==='task') openForm('task',item); else openForm('habit',state.habits.find(h=>h.id===item.habitId));});
      card.addEventListener('dragstart',e=>{dragId=item.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.id);});
      card.addEventListener('dragend',()=>{$$('.task-card').forEach(c=>c.classList.remove('dragging','drop-target'));dragId=null;});
      card.addEventListener('dragover',e=>{e.preventDefault();if(card.dataset.id!==dragId)card.classList.add('drop-target');});
      card.addEventListener('dragleave',()=>card.classList.remove('drop-target'));
      card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drop-target');reorderItems(item.id);});
      $('.move-up',card).addEventListener('click',()=>moveItem(item.id,-1));
      $('.move-down',card).addEventListener('click',()=>moveItem(item.id,1));
    });
  }
  function reorderItems(targetId){
    if(!dragId||dragId===targetId)return;
    const items=getDayItems(selectedDate);const ids=items.map(x=>x.id);const from=ids.indexOf(dragId),to=ids.indexOf(targetId);if(from<0||to<0)return;ids.splice(to,0,ids.splice(from,1)[0]);persistOrder(selectedDate,ids);render();
  }
  function moveItem(itemId,delta){const ids=getDayItems(selectedDate).map(x=>x.id);const i=ids.indexOf(itemId),j=i+delta;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];persistOrder(selectedDate,ids);render();}
  function renderWeek(){
    const dates=getWeekDates(selectedDate);const habits=state.habits.filter(h=>h.active);
    $('#screen').innerHTML=`<div class="heading-row"><div><div class="eyebrow">ТВОЙ ПЛАН</div><h1>Неделя ♡</h1><p class="subtle">Привычки и маленькие победы каждый день.</p></div><div class="toolbar"><button class="soft-btn" id="prevWeek">‹</button><button class="soft-btn" id="nextWeek">›</button></div></div>
      <div class="subtle" style="margin:0 2px 12px">${fmtDate(dates[0])} — ${fmtDate(dates[6])}</div>
      ${habits.length?`<div class="week-grid-wrap"><table class="habit-grid"><thead><tr><th>Привычка</th>${dates.map(d=>`<th>${DAY_NAMES[fromISO(d).getDay()]}<br>${fromISO(d).getDate()}</th>`).join('')}</tr></thead><tbody>${habits.map(h=>`<tr><td><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${h.color};margin-right:4px"></span>${escapeHTML(h.title)}</td>${dates.map(d=>{const scheduled=isScheduled(h,d),o=findOccurrence(h.id,d);return `<td><button class="habit-cell ${scheduled?'scheduled':''} ${o?.done?'completed':''}" style="${scheduled?'--habit-color:'+h.color:''}" data-occ="${o?.id||''}" data-date="${d}" ${!scheduled?'disabled':''} title="${scheduled?'Отметить выполнение':'Не запланировано'}">${o?.done?'✓':scheduled?'·':'–'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="legend"><span><i style="background:#e5dbea"></i> Запланировано</span><span><i></i> Выполнено</span></div>`:`<div class="empty"><div class="empty-icon">↻</div><strong>Пока нет привычек</strong><p>Добавь привычку — и здесь появится её расписание на неделю.</p></div>`}
      <button class="add-btn" id="addHabitBtn">＋ Создать привычку</button>`;
    $('#prevWeek').addEventListener('click',()=>{selectedDate=shiftDate(selectedDate,-7);render();});$('#nextWeek').addEventListener('click',()=>{selectedDate=shiftDate(selectedDate,7);render();});$('#addHabitBtn').addEventListener('click',()=>openForm('habit'));
    $$('[data-occ]').forEach(b=>b.addEventListener('click',()=>{const o=state.occurrences.find(x=>x.id===b.dataset.occ);if(o){o.done=!o.done;o.completedAt=o.done?new Date().toISOString():null;saveState();render();}}));
  }
  function renderHabits(){
    const habits=state.habits;
    $('#screen').innerHTML=`<div class="heading-row"><div><div class="eyebrow">МОЙ РИТМ</div><h1>Привычки ♡</h1><p class="subtle">То, что становится частью твоего дня.</p></div></div>
      ${habits.length?`<div class="task-list">${habits.map(h=>`<article class="habit-card"><div class="color-mark" style="background:${h.color}"></div><div class="habit-info"><div class="habit-name">${escapeHTML(h.title)} ${h.active?'':'<span style="color:#aaa;font-weight:500">· пауза</span>'}</div><div class="habit-days">${h.weekdays.length===7?'Каждый день':h.weekdays.map(d=>DAY_NAMES[d]).join(', ')}</div></div><div class="streak">🔥 ${streakFor(h)}</div><button class="icon-btn edit-habit" data-id="${h.id}" title="Редактировать">···</button></article>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">✧</div><strong>Создай первую привычку</strong><p>Выбери дни недели, и Tasky добавит её в нужные дни автоматически.</p></div>`}
      <button class="add-btn" id="addHabitBtn">＋ Новая привычка</button>
      <p class="notice">Серия учитывает только те дни, на которые привычка была запланирована. Выходные и дни без расписания не прерывают её.</p>`;
    $('#addHabitBtn').addEventListener('click',()=>openForm('habit'));
    $$('.edit-habit').forEach(b=>b.addEventListener('click',()=>{const h=state.habits.find(x=>x.id===b.dataset.id);openForm('habit',h);}));
  }
  function renderHistory(){
    const completed=[...state.tasks.filter(t=>t.done&&t.date<=todayISO()).map(t=>({...t,kind:'task'})),...state.occurrences.filter(o=>o.done&&o.date<=todayISO()).map(o=>({...o,kind:'habit'}))].sort((a,b)=>b.date.localeCompare(a.date));
    const total=completed.length;const active=state.habits.filter(h=>h.active);const best=active.reduce((m,h)=>Math.max(m,streakFor(h)),0);
    const days=[...new Set(completed.map(x=>x.date))].slice(0,30);
    $('#screen').innerHTML=`<div class="heading-row"><div><div class="eyebrow">ТВОЙ ПРОГРЕСС</div><h1>История ♡</h1><p class="subtle">Каждый маленький шаг имеет значение.</p></div></div>
      <div class="history-summary"><div class="stat-card"><div class="eyebrow">Выполнено всего</div><div class="stat-value">${total}</div><div class="stat-label">задач и привычек</div></div><div class="stat-card"><div class="eyebrow">Лучшая серия сейчас</div><div class="stat-value">${best} ✦</div><div class="stat-label">дней подряд</div></div></div>
      <div class="section-row"><h2>Недавняя активность</h2><span class="count-pill">${days.length} дней</span></div>
      ${days.length?days.map(d=>`<div class="history-day"><div class="history-day-head"><span>${escapeHTML(fmtLong(d))}</span><span>${completed.filter(x=>x.date===d).length} ✓</span></div>${completed.filter(x=>x.date===d).map(t=>`<div class="history-item completed"><i class="mini-dot"></i><span>${escapeHTML(t.title)}</span><span class="type-tag">${t.kind==='habit'?'Привычка':'Задача'}</span></div>`).join('')}</div>`).join(''):`<div class="empty"><div class="empty-icon">♡</div><strong>Твоя история начнётся здесь</strong><p>Отмечай выполненные задачи, и они будут собираться в этом разделе.</p></div>`}
      <div class="section-row" style="margin-top:20px"><h2>Резервная копия</h2></div><div class="toolbar"><button class="soft-btn" id="exportData">Экспорт данных</button><button class="soft-btn" id="importData">Импорт JSON</button><input type="file" id="importFile" accept="application/json" class="hide"></div><p class="notice">Сохраняй резервную копию перед сменой устройства или очисткой данных браузера.</p>`;
    $('#exportData').addEventListener('click',exportData);$('#importData').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',importData);
  }
  function openForm(kind='task',item=null){
    formKind=kind;editing=item?{...item}:null;selectedColor=item?.color||COLORS[0];selectedDays=item?.weekdays?[...item.weekdays]:[1,2,3,4,5,6,0];
    $('#formTitle').textContent=item?(kind==='habit'?'Изменить привычку':'Изменить задачу'):(kind==='habit'?'Новая привычка':'Новая задача');
    $('#itemTitle').value=item?.title||'';$('#itemDate').value=item?.date||selectedDate;$('#startDate').value=item?.startDate||selectedDate;
    $('#typeSwitch').classList.toggle('hide',!!item);
    setFormKind(kind);renderSwatches();renderWeekdayPicker();
    $('#deleteItem').classList.toggle('hide',!item);$('#saveItem').textContent=item?'Сохранить изменения':(kind==='habit'?'Создать привычку':'Добавить задачу');
    $('#formOverlay').classList.add('open');setTimeout(()=>$('#itemTitle').focus(),80);
  }
  function setFormKind(kind){
    formKind=kind;$$('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));
    $('#dateField').classList.toggle('hide',kind==='habit');$('#daysField').classList.toggle('hide',kind!=='habit');$('#startField').classList.toggle('hide',kind!=='habit');
    $('#saveItem').textContent=kind==='habit'?'Создать привычку':'Добавить задачу';
  }
  function renderSwatches(){ $('#swatches').innerHTML=COLORS.map((c,i)=>`<button type="button" class="swatch ${selectedColor===c?'selected':''}" style="background:${c}" data-color="${c}" aria-label="${COLOR_NAMES[i]}"></button>`).join('');$$('[data-color]').forEach(b=>b.addEventListener('click',()=>{selectedColor=b.dataset.color;renderSwatches();})); }
  function renderWeekdayPicker(){ $('#weekdayPicker').innerHTML=[1,2,3,4,5,6,0].map(d=>`<button type="button" class="weekday ${selectedDays.includes(d)?'selected':''}" data-weekday="${d}">${DAY_NAMES[d]}</button>`).join('');$$('[data-weekday]').forEach(b=>b.addEventListener('click',()=>{const d=Number(b.dataset.weekday);selectedDays=selectedDays.includes(d)?selectedDays.filter(x=>x!==d):[...selectedDays,d];renderWeekdayPicker();})); }
  function closeForm(){ $('#formOverlay').classList.remove('open');editing=null; }
  function saveItem(e){
    e.preventDefault();const title=$('#itemTitle').value.trim();if(!title)return;
    if(formKind==='task'){
      const date=$('#itemDate').value;if(!date){toast('Выбери дату');return;}
      if(editing){const t=state.tasks.find(x=>x.id===editing.id);if(t){t.title=title;t.color=selectedColor;t.date=date;}}
      else state.tasks.push({id:id(),title,color:selectedColor,date,done:false,createdAt:new Date().toISOString()});
      selectedDate=date;toast(editing?'Задача обновлена':'Задача добавлена');
    } else {
      if(!selectedDays.length){toast('Выбери хотя бы один день');return;}
      const startDate=$('#startDate').value||todayISO();
      if(editing){
        const h=state.habits.find(x=>x.id===editing.id);
        if(h){h.title=title;h.color=selectedColor;h.weekdays=[...selectedDays];h.startDate=startDate;h.active=true;}
        state.occurrences=state.occurrences.filter(o=>!(o.habitId===editing.id&&o.date>=todayISO()&&!o.done));
        toast('Привычка обновлена');
      } else {
        state.habits.push({id:id(),title,color:selectedColor,weekdays:[...selectedDays],startDate,active:true,createdAt:new Date().toISOString()});
        toast('Привычка создана');
      }
      ensureOccurrences(shiftDate(todayISO(),-60),180);
    }
    saveState();closeForm();render();
  }
  function deleteEditing(){
    if(!editing)return;
    if(formKind==='task') state.tasks=state.tasks.filter(t=>t.id!==editing.id);
    else {
      const h=state.habits.find(x=>x.id===editing.id);if(h){h.active=false;h.archivedAt=todayISO();}
      state.occurrences=state.occurrences.filter(o=>o.habitId!==editing.id||o.date<todayISO()||o.done);
    }
    saveState();closeForm();render();toast('Удалено');
  }
  function exportData(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`tasky-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(url);toast('Резервная копия создана');
  }
  function importData(e){
    const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.habits)||!Array.isArray(parsed.occurrences))throw new Error('wrong format');state={...defaultState(),...parsed};saveState();render();toast('Данные импортированы');}catch(err){toast('Не удалось прочитать этот файл');}};reader.readAsText(file);e.target.value='';
  }
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;render();}));
  $('#closeForm').addEventListener('click',closeForm);$('#formOverlay').addEventListener('click',e=>{if(e.target===$('#formOverlay'))closeForm();});
  $('#itemForm').addEventListener('submit',saveItem);$('#deleteItem').addEventListener('click',deleteEditing);
  $$('[data-kind]').forEach(b=>b.addEventListener('click',()=>setFormKind(b.dataset.kind)));
  $('#profileBtn').addEventListener('click',()=>toast('Tasky сохраняет твой ритм ♡'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm();});
  // Telegram Mini Apps integration. The app remains usable in an ordinary browser too.
  try { const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand(); if(tg.setHeaderColor)tg.setHeaderColor('#f7f5f2'); if(tg.setBackgroundColor)tg.setBackgroundColor('#f7f5f2');} } catch(e){console.info('Telegram bridge unavailable; browser mode enabled.');}
  ensureOccurrences(shiftDate(todayISO(),-60),180);
  render();
})();
</script>
</body>
</html>
